name: Release Binary
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: cross build --release --target ${{ matrix.target }}

      - name: Check size
        run: |
          size target/${{ matrix.target }}/release/muse

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="muse-${VERSION}-${{ matrix.name }}"
          
          rm -rf dist
          mkdir -p dist/$ARCHIVE
          
          test -f target/${{ matrix.target }}/release/muse
          cp target/${{ matrix.target }}/release/muse dist/$ARCHIVE/
          cp README.md dist/$ARCHIVE/
          
          tar -czf "${ARCHIVE}.tar.gz" -C dist "$ARCHIVE"

      - name: Generate Checksums
        run: |
          sha256sum "muse-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" \
                      > "muse-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-${{ matrix.name }}
          path: |
            muse-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
            muse-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256
  release:
    name: Create Github Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir upload
          find release-assets -type f -exec cp {} upload/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: upload/*