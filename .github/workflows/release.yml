name: Release Binary
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
        type: string

permissions:
  contents: write

env:
  CROSS_VERSION: "0.2.5"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            name: linux-aarch64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross@${{ env.CROSS_VERSION }}

      - name: Build
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
        run: cross build --release --target ${{ matrix.target }}

      - name: Check size
        run: |
          size target/${{ matrix.target }}/release/muse

      - name: Package
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          ARCHIVE="muse-${VERSION}-${{ matrix.name }}"
          
          rm -rf dist
          mkdir -p dist/${ARCHIVE}
          
          test -f target/${{ matrix.target }}/release/muse
          cp target/${{ matrix.target }}/release/muse dist/${ARCHIVE}/
          cp README.md dist/${ARCHIVE}/
          
          tar -czf "${ARCHIVE}.tar.gz" -C dist "$ARCHIVE"

      - name: Generate Checksums
        run: | 
          VERSION="${{ inputs.tag || github.ref_name }}" 
          ARCHIVE="muse-${VERSION}-${{ matrix.name }}.tar.gz" 
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: muse-${{ matrix.name }}
          path: |
            muse-${{ inputs.tag || github.ref_name }}-${{ matrix.name }}.tar.gz
            muse-${{ inputs.tag || github.ref_name }}-${{ matrix.name }}.tar.gz.sha256
  release:
    name: Create Github Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir upload
          find release-assets -type f -exec cp {} upload/ \;

      - name: Generate commit list
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"

          PREV_TAG=$(
            git describe \
              --tags \
              --abbrev=0 \
              "${TAG}^" \
              2>/dev/null || true
          )

          {
            echo "## Commits"
            echo

            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${TAG}" \
                --pretty=format:"- %s (%h)"
            else
              git log "${TAG}" \
                --pretty=format:"- %s (%h)"
            fi
          } > RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: upload/*